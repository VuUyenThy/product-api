name: Deploy Product API to Local Docker

on:
  push:
    tags:
      - "v*"

jobs:

  deploy:

    runs-on: self-hosted

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker version

      - name: Pull production images
        run: docker compose -f docker-compose-prod.yaml pull

      - name: Deploy production
        run: docker compose -f docker-compose-prod.yaml up -d

      - name: Check containers
        run: docker compose -f docker-compose-prod.yaml ps

      - name: Check Product API
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -Uri "http://localhost:3000/health" -UseBasicParsing

          if ($response.StatusCode -ne 200) {
              Write-Error "Product API is not healthy"
              exit 1
          }

          Write-Host "Product API is healthy"
          Write-Host $response.Content
